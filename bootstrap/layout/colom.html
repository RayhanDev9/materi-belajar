<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Colom</title>


    <style>
        .bordered {
            border: solid;
            margin-top: 30px;
        }

        .contoh {
            height: 50px;
            background: skyblue;
        }

        .jarak {
            margin-bottom: 20px;
        }

    </style>

</head>
<body>

    <!-- Colom -->
    <!-- Justifay  -->
    <div class="container bordered">
        <div class="row align-items-start justify-content-evenly" style="height: 100vh;">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 jarak">
                <div class="contoh"></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 jarak">
                <div class="contoh"></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 jarak">
                <div class="contoh"></div>
            </div>
        </div>
    </div>

        <!-- Order -->
    <div class="container bordered">
        <div class="row" >
            <div class="col-12 col-sm-6 col-md-4 col-lg-3  order-4 jarak">
                <div class="contoh">1</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3  order-3 jarak">
                <div class="contoh">2</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3  order-1 jarak">
                <div class="contoh">3</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3  order-2 jarak">
                <div class="contoh">4</div>
            </div>
        </div>
    </div>

    <!-- Ofset -->
    <div class="container bordered">
        <div class="row" >
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 jarak">
                <div class="contoh">1</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 offset-6 jarak">
                <div class="contoh">2</div>
            </div>
        </div>
    </div>

    <div class="container bordered">
        <div class="row" >
            <div class="col-3 jarak">
                <div class="contoh">1</div>
            </div>
            <div class="col-3 offset-md-2 jarak">
                <div class="contoh">2</div>
            </div>
        </div>
    </div>

    




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
